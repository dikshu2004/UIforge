<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIForge - Button Component</title>
  <script type="module" crossorigin src="/assets/index-CjH-0Ky1.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BP8UbOBx.css">
</head>

<body>

  <div class="container py-4">

    <!-- Header -->
    <div class="mb-4">
      <h1 class="text-primary">UIForge</h1>
      <p class="text-secondary">Button Component Showcase & Test Page</p>
    </div>

    <!-- 1. Solid Buttons -->
    <div class="mb-4">
      <h3 class="mb-2">1. Solid Buttons</h3>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-black">Black</button>
      </div>
    </div>

    <!-- 2. Outline Buttons -->
    <div class="mb-4">
      <h3 class="mb-2">2. Outline Buttons</h3>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary">Primary</button>
        <button class="btn btn-outline-secondary">Secondary</button>
        <button class="btn btn-outline-success">Success</button>
        <button class="btn btn-outline-danger">Danger</button>
        <button class="btn btn-outline-warning">Warning</button>
        <button class="btn btn-outline-info">Info</button>
        <button class="btn btn-outline-black">Black</button>
      </div>
    </div>

    <!-- 3. Button Sizes -->
    <div class="mb-4">
      <h3 class="mb-2">3. Button Sizes</h3>
      <div class="d-flex align-center gap-2">
        <button class="btn btn-primary btn-sm">Small (.btn-sm)</button>
        <button class="btn btn-primary">Default</button>
        <button class="btn btn-primary btn-lg">Large (.btn-lg)</button>
      </div>
    </div>

    <!-- 4. Disabled States -->
    <div class="mb-4">
      <h3 class="mb-2">4. Disabled State</h3>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" disabled>Disabled Solid</button>
        <button class="btn btn-outline-primary" disabled>Disabled Outline</button>
      </div>
    </div>

    <!-- 5. Block / Full Width Button -->
    <div class="mb-4">
      <h3 class="mb-2">5. Block Button</h3>
      <button class="btn btn-primary btn-block">Full Width Button (.btn-block)</button>
    </div>

  </div>

  <div class="card m-4" >
    <div class="card-body">
      <h3>UIForge</h3>
      <p>My own UI library.</p>
      <button class="btn btn-primary">Learn More</button>
    </div>
  </div>

</body>
</html>
